name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
      - run: opam install -y dune ounit2 js_of_ocaml
      - run: opam exec -- dune build
      - run: opam exec -- dune test
      - run: sudo apt-get update && sudo apt-get install -y llvm
      - run: opam exec -- bash scripts/check_llvm.sh
      - run: opam exec -- dune exec ./bin/optc.exe -- bench test/programs
